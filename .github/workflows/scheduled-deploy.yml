name: Scheduled deployments

on:
  schedule:
    - cron: '17 19 * * 5' # Friday at 19:17
      timezone: Europe/Helsinki
    - cron: '17 4 * * 1' # Monday at 04:17
      timezone: Europe/Helsinki

permissions:
  contents: write

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  deploy-dynamic:
    if: ${{ github.event.schedule == '17 19 * * 5' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy dynamic site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run deploy:dynamic

  deploy-static:
    if: ${{ github.event.schedule == '17 4 * * 1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy static site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run deploy:static
